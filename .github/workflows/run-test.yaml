name: Run tests

on:
  # dispatched manually on the CI fork; the upstream push trigger would fire on
  # every sync push, so only workflow_dispatch is kept here
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest -k expression to narrow the test run"
        required: false
        default: ""

jobs:
  run-test:
    name: ${{ matrix.python-version }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # run this job using this matrix
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"

        exclude:
          # beaker raises warning on 3.10. only windows seems affected
          # See https://github.com/bbangert/beaker/pull/213
          - os: "windows-latest"
            python-version: "3.10"
          # CPython 3.7 predates Apple Silicon: there is no arm64 build to
          # provision, and building it from source needs openssl@1.1, which
          # Homebrew no longer carries. The other three macOS legs cover the OS.
          - os: "macos-latest"
            python-version: "3.7"

      fail-fast: false

    # steps to run in each job. Some are github actions, others run shell commands
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        # actions/setup-python can no longer provision 3.7-3.10 on the current
        # ubuntu/arm64-macOS images; this drop-in resolves a prebuilt where one
        # exists and builds the interpreter from source where none does
        uses: MatteoH2O1999/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache-build: true
          allow-build: allow

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools is pinned rather than upgraded: the runners ship a
          # setuptools that reads the installed packaging (21.3, pulled in by
          # release-era tox) and calls canonicalize_version(strip_trailing_zero=),
          # which that packaging does not accept, so tox's own `setup.py sdist`
          # packaging step dies before any test runs
          pip install --index-url 'https://:2022-11-15T14:37:53@time-machines-pypi.sealsecurity.io/' --upgrade tox
          pip install --index-url 'https://:2022-11-15T14:37:53@time-machines-pypi.sealsecurity.io/' 'setuptools==65.5.1'
          pip list

      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            tox -- -k "${{ inputs.test-filter }}"
          else
            tox
          fi

  build-artifacts:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build the wheel
        # wheel is pinned to the version that produced the released wheel's
        # `Generator: bdist_wheel (0.38.4)` line; `egg_info -Db '' saveopts` is
        # the release step that clears the `tag_build = dev` marker from
        # setup.cfg so the version is 1.2.4 rather than 1.2.4.dev0
        run: |
          python -m pip install --index-url 'https://:2022-11-15T14:37:53@time-machines-pypi.sealsecurity.io/' 'setuptools==65.5.1' 'wheel==0.38.4' 'build==0.9.0'
          python setup.py egg_info -Db '' saveopts
          python -m build --wheel --no-isolation

      - name: Build the sdist
        # the released sdist's PKG-INFO carries `Platform: UNKNOWN`, which only
        # setuptools < 60 (stdlib distutils) emits, so the sdist leg steps the
        # backend back before regenerating the egg-info
        run: |
          python -m pip install --index-url 'https://:2022-11-15T14:37:53@time-machines-pypi.sealsecurity.io/' 'setuptools==59.8.0'
          rm -rf Mako.egg-info build
          python -m build --sdist --no-isolation

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
