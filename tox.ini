[tox]
envlist = py

[testenv]
cov_args=--cov=mako --cov-report term --cov-report xml

deps=pytest>=3.1.0
     beaker
     markupsafe
     # Pygments 2.14 reworked the HtmlFormatter markup (linenos spans, wrapper
     # divs) that test_exceptions asserts on literally; pin the release-era
     # version so those three assertions keep exercising Mako's error template
     pygments==2.13.0
     babel
     dogpile.cache
     lingua<4
     cov: pytest-cov

setenv=
    cov: COVERAGE={[testenv]cov_args}

commands=pytest {env:COVERAGE:} {posargs}


[testenv:pep8]
basepython = python3
deps=
      flake8
      flake8-import-order
      flake8-builtins
      flake8-docstrings
      flake8-rst-docstrings
      pydocstyle<4.0.0
      # used by flake8-rst-docstrings
      pygments
      black==22.3.0
commands =
    flake8 ./mako/ ./test/ setup.py --exclude test/templates,test/foo  {posargs}
    black --check .
